# Installed by the SWE40006 A2 CodeDeploy revision (configure_wordpress.sh).
# Lets WordPress use .htaccess for permalinks (as the AL2023 WordPress tutorial recommends).
<Directory "/var/www/html/WordPress">
    AllowOverride All
</Directory>
# Deployment files travel inside the revision but must never be served.
<DirectoryMatch "^/var/www/html/WordPress/(scripts|config)">
    Require all denied
</DirectoryMatch>
<Files "appspec.yml">
    Require all denied
</Files>
